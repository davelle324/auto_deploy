<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Auto Deploy</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: 1.75rem;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -.3px;
      color: var(--text);
    }
    .login-brand-mark {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(99,60,220,.4);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark">⚡</div>
        Auto Deploy
      </div>

      {% if error %}
      <div class="alert alert-error" style="margin-bottom:1.25rem;">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autofocus
                 placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
          Sign in
        </button>
      </form>

      <p style="margin-top:1.5rem;font-size:13px;color:var(--text-muted);text-align:center;line-height:1.5;">
        This is a personal instance. Want to try it yourself?
        <a href="https://github.com/davelle324/auto_deploy" target="_blank" rel="noopener"
           style="color:var(--accent);text-decoration:none;white-space:nowrap;">
          Download a copy on GitHub
        </a>
      </p>
    </div>
  </div>
</body>
</html>
