[project]
name = "auto-deploy"
version = "0.1.0"
description = "Meta-deployment platform wrapping Vercel, Netlify, and Render REST APIs"
requires-python = ">=3.11"

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "pylint>=4.0.6",
    "httpx>=0.27",
    "aiosqlite>=0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["."]
core = "sysmon"
omit = [
    "tests/*",
    "htmlcov/*",
    "sample_site/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pylint.main]
source-roots = ["."]
jobs = 1
recursive = true
ignore = ["tests", "htmlcov", "sample_site"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = "i,j,k,ex,Run,_,e,id,app,db,v"

[tool.pylint.design]
max-args = 7
max-positional-arguments = 7
max-attributes = 12

[tool.pylint.similarities]
min-similarity-lines = 6
